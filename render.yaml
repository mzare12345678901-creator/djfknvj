services:
  - type: worker
    name: bale-ai-video-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: BALE_BOT_TOKEN
        sync: false
      - key: AIMLAPI_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: SOURCE_CHANNEL
        value: "@viiideoai"
      - key: DEST_CHANNEL
        sync: false
      - key: AIMLAPI_BASE_URL
        value: "https://api.aimlapi.com/v1"
      - key: AI_MODEL
        value: "google/gemini-2.5-flash"
